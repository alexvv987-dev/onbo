# Secrets and DATABASE_URL are supplied only through environment variables.
http:
  address: ':8080'
  read_header_timeout: 5s
  read_timeout: 10s
  write_timeout: 60s
  idle_timeout: 60s
lifecycle:
  init_timeout: 15s
  shutdown_timeout: 10s
redis:
  address: ''
  dial_timeout: 3s
  read_timeout: 3s
  write_timeout: 3s
  session_ttl: 12h
  rate_window: 60s
  chat_rate_limit: 20
mock:
  url: http://mock:8081
  timeout: 4s
llm:
  mode: gigachat
  model: ''
  api_url: https://api.giga.chat/v1
  oauth_url: https://ngw.devices.sberbank.ru:9443/api/v2/oauth
  scope: GIGACHAT_API_PERS
  ca_file: ''
  request_timeout: 45s
  reply_timeout: 90s
api:
  health_timeout: 2s
  chat_timeout: 45s
  max_request_bytes: 32768
demo_mode: false
static_dir: web/dist
